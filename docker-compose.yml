services:
  postgres:
    image: postgres:16-alpine
    container_name: judgeguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./apps/api
    container_name: judgeguard-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SIGNING_SECRET: ${SIGNING_SECRET}
      VOTE_RATE_LIMIT: ${VOTE_RATE_LIMIT}
      VOTE_RATE_WINDOW_SECONDS: ${VOTE_RATE_WINDOW_SECONDS}
      COMMENT_RATE_LIMIT: ${COMMENT_RATE_LIMIT}
      COMMENT_RATE_WINDOW_SECONDS: ${COMMENT_RATE_WINDOW_SECONDS}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS}
      PUBLIC_VOTER_COOKIE_NAME: ${PUBLIC_VOTER_COOKIE_NAME}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: judgeguard-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
